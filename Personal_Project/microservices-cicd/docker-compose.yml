services:
  auth-service:
    build:
      context: ./services/auth-service
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/auth-service
      - JWT_SECRET=dev-secret
    depends_on:
      - mongo
    networks:
      - microservices

  order-service:
    build:
      context: ./services/order-service
    ports:
      - "3002:3002"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/order-service
    depends_on:
      - mongo
    networks:
      - microservices

  api-gateway:
    build:
      context: ./services/api-gateway
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:3001
      - ORDER_SERVICE_URL=http://order-service:3002
    depends_on:
      - auth-service
      - order-service
    networks:
      - microservices

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - microservices

volumes:
  mongo-data:

networks:
  microservices:
