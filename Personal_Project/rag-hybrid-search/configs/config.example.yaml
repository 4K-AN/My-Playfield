# RAG Pipeline Configuration

llm:
  provider: openai          # openai | local
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 1024
  api_key: ${OPENAI_API_KEY}  # reads from .env

embedding:
  model: all-MiniLM-L6-v2   # sentence-transformers model name
  device: cpu                # cpu | cuda
  batch_size: 64

chunking:
  strategy: recursive        # recursive | sentence | sliding_window
  chunk_size: 512            # tokens
  chunk_overlap: 64          # tokens overlap between chunks
  min_chunk_size: 50         # discard chunks smaller than this

vector_db:
  provider: chromadb
  persist_dir: ./chroma_db
  collection_name: rag_docs
  distance_metric: cosine    # cosine | l2 | ip

retrieval:
  dense_top_k: 20            # candidates from vector search
  sparse_top_k: 20           # candidates from BM25
  final_top_k: 5             # results after fusion + rerank
  rrf_k: 60                  # RRF constant (higher = smoother fusion)
  alpha: 0.5                 # weight blend: 0=sparse only, 1=dense only

reranker:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  device: cpu
  batch_size: 32

eval:
  faithfulness_threshold: 0.7
  relevance_threshold: 0.7
  sample_size: 100
