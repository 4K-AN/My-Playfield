<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan Blockquote</title>
    <style>
        blockquote {
            font-size: 24px;
        }
        blockquote::before {
            content: open-quote;
        }
        blockquote::after {
            content: close-quote;
        }
    </style>
</head>
<body>
    <blockquote>I'd volunteer to go to prison, as long as there are books. Because with books I am free.</blockquote>
</body>
</html>
