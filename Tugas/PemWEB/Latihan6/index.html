<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan Tabel Riwayat Pendidikan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fafafa;
        }
        table {
            width: 60%;
            margin: 30px auto;
            border-collapse: collapse;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #4a90e2;
            color: white;
            font-size: 15px;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #eaf3ff;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Tabel Riwayat Pendidikan</h2>
    <table>
        <thead>
            <tr>
                <th rowspan="2">No.</th>
                <th rowspan="2">Nama Sekolah</th>
                <th colspan="2">Tahun</th>
            </tr>
            <tr>
                <th>Masuk</th>
                <th>Lulus</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1.</td>
                <td>Nama TK</td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>2.</td>
                <td>Nama SD</td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>3.</td>
                <td>Nama SMP</td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>4.</td>
                <td>Nama SMA</td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>5.</td>
                <td>Nama Perguruan Tinggi</td>
                <td></td>
                <td></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
