<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WowoClean - Sistem Logistik Pengelolaan Limbah B3">
    <title>WowoClean - Waste Tracking System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">WowoClean</div>
        <div class="muatan-total">
            Total Muatan: <span id="total-weight">0</span> Kg
        </div>
    </nav>
    <main class="container">
        <section class="form-section">
            <h2>Registrasi Kontainer</h2>
            <form id="container-form">
                <div class="form-group">
                    <label for="container_id">ID Kontainer</label>
                    <input type="text" id="container_id" name="container_id" placeholder="Misal: WA12345">
                    <span class="error-message" id="error-container_id"></span>
                </div>
                <div class="form-group">
                    <label for="waste_type">Tipe Limbah</label>
                    <select id="waste_type" name="waste_type">
                        <option value="">Pilih Tipe</option>
                        <option value="Plastic">Plastic</option>
                        <option value="Chemical">Chemical</option>
                        <option value="Metal">Metal</option>
                        <option value="Organic">Organic</option>
                    </select>
                    <span class="error-message" id="error-waste_type"></span>
                </div>
                <div class="form-group">
                    <label for="weight_kg">Berat (Kg)</label>
                    <input type="number" id="weight_kg" name="weight_kg" placeholder="10 - 5000">
                    <span class="error-message" id="error-weight_kg"></span>
                </div>
                <button type="submit" class="btn-submit">Simpan Data</button>
            </form>
        </section>

        <section class="data-section">
            <div class="data-header">
                <h2>Daftar Kontainer</h2>
                <div class="filter-controls">
                    <input type="text" id="filter-type" placeholder="Filter Tipe Limbah">
                    <input type="number" id="filter-weight" placeholder="Min Berat (Kg)">
                    <button class="btn-filter" id="btn-search">Cari</button>
                </div>
            </div>
            <div class="card-grid" id="container-list"></div>
        </section>
    </main>

    <div class="modal" id="logs-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Log Perjalanan Kontainer</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body" id="logs-content"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
